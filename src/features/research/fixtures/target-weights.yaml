apiVersion: fertile.finance/strategy/v1
kind: StrategyBundle
metadata:
  id: example.equity-top-five
  version: '1.0.0'
  title: '日线动量前五等权'
spec:
  engine: nautilus_cash_equity
  mode: backtest
  universe: { ref: 'example.us-cash-equities@1.0.0', membership: point_in_time }
  data:
    bars: 'example.reviewed-us-daily@1.0.0'
    timeframe: 1d
    price_basis: raw_split_free_reviewed
    currency: USD
  clock:
    calendar: XNYS
    decide_on: session_close
    earliest_fill: next_session_close
    warmup_sessions: 30
    missing_input: block_new_risk
  factors:
    mom20:
      use: 'factor.close_return@1.0.0'
      params: { lookback_sessions: 20 }
  modules:
    top_five:
      kind: allocator
      use: 'allocator.top_n@1.0.0'
      params: { factor: mom20, top_n: 5 }
    complete_bar:
      kind: filter
      use: 'filter.complete_session_bar@1.0.0'
      params: { require_positive_volume: true }
    cash_only:
      kind: risk
      use: 'risk.long_only_cash@1.0.0'
      params: { max_gross_weight: '1', allow_borrow: false }
  recipes:
    topFive:
      type: target_weights
      allocator: top_five
      filters: [complete_bar]
      risk: [cash_only]
  portfolio:
    initial_cash: { currency: USD, amount: '100000' }
    sleeves:
      - { recipe: topFive, budget_weight: '1', priority: 10 }
    allocation: fixed_budgets
    residual: cash
    netting: by_instrument
    max_gross_weight: '1'
    max_weight_per_asset: '0.25'
  policy:
    on_entry_exit_collision: exit_first
    same_session_reentry: false
    on_missing_execution_price: defer_and_report
    tie_break: stable_instrument_id
  execution:
    model: 'execution.next_close_cash_equity@1.0.0'
    lot_size_policy: instrument_master
    commission_bps: '2'
    slippage_bps: '5'
